name: Build Desktop Application

on:
  push:
    branches: [ new-exe ]
  pull_request:
    branches: [ new-exe ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Build frontend
      run: npm run build

    - name: Verify resources directory
      shell: bash
      run: |
        echo "Checking resources directory..."
        if [ ! -d "resources" ]; then
          echo "ERROR: Resources directory not found"
          exit 1
        fi
        echo "Resources structure:"
        find resources/ -type f | head -10
        echo "Resources verified successfully!"

    - name: Build server
      run: npm run build:server

    - name: Verify server build
      shell: bash
      run: |
        echo "Checking server build files..."
        ls -la dist/
        if [ ! -f "dist/index.js" ]; then
          echo "ERROR: Server build failed - index.js not found"
          exit 1
        fi
        echo "Server build verified successfully!"

    - name: Verify all build files
      shell: bash
      run: |
        echo "=== Build Verification Summary ==="
        echo "Server build: dist/index.js ($(ls -lh dist/index.js | awk '{print $5}')"
        echo "Frontend build: dist/public/index.html"
        echo "CSS assets: $(find dist/public/assets -name '*.css' | wc -l) files"
        echo "JS assets: $(find dist/public/assets -name '*.js' | wc -l) files"
        echo "Resources voices: $(find resources/voices -name '*.mp3' -o -name '*.wav' | wc -l) files"
        echo "Resources images: $(find resources/images -name '*.png' -o -name '*.jpg' | wc -l) files"
        echo "=================================="

    - name: Build Electron app
      run: npm run electron:dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: GrandBingo-Desktop-${{ github.run_number }}
        path: release/*.exe
        retention-days: 0
        compression-level: 0
        if-no-files-found: warn

    - name: Upload to Transfer.sh (Emergency Bypass)
      continue-on-error: true
      shell: bash
      run: |
        echo "🚀 EMERGENCY BYPASS: Uploading to Transfer.sh (14-day storage)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Find the .exe file
        EXE_FILE=$(find release/ -name "*.exe" | head -1)
        
        if [ -f "$EXE_FILE" ]; then
          echo "Found executable: $EXE_FILE" >> $GITHUB_STEP_SUMMARY
          echo "File size: $(ls -lh "$EXE_FILE" | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Upload to transfer.sh
          echo "Uploading to Transfer.sh..." >> $GITHUB_STEP_SUMMARY
          TRANSFER_URL=$(curl --upload-file "$EXE_FILE" https://transfer.sh/$(basename "$EXE_FILE") 2>/dev/null)
          
          if [ ! -z "$TRANSFER_URL" ]; then
            echo "✅ Upload successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🎯 DIRECT DOWNLOAD LINK" >> $GITHUB_STEP_SUMMARY
            echo "**Download URL (valid for 14 days):**" >> $GITHUB_STEP_SUMMARY
            echo "$TRANSFER_URL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Click the link above to download immediately!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Also save to workflow output for easy access
            echo "transfer_url=$TRANSFER_URL" >> $GITHUB_OUTPUT
          else
            echo "❌ Transfer.sh upload failed" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "❌ No .exe file found in release directory" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Create Release Summary
      if: always()
      shell: bash
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Run Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Repository**: noxfighter777-sudo/adis_bingo" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # List all files in release directory
        echo "### Release Files" >> $GITHUB_STEP_SUMMARY
        if [ -d "release" ]; then
          for file in release/*; do
            if [ -f "$file" ]; then
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "- **$(basename "$file")**: $size" >> $GITHUB_STEP_SUMMARY
            fi
          done
        else
          echo "- No release files found" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 🔥 STORAGE QUOTA SOLUTIONS" >> $GITHUB_STEP_SUMMARY
        echo "**GitHub storage quota exceeded - but we have bypass solutions:**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 🚀 1️⃣ TRANSFER.SH BYPASS (RECOMMENDED)" >> $GITHUB_STEP_SUMMARY
        echo "- **Direct Download**: Check above for Transfer.sh link (14-day validity)" >> $GITHUB_STEP_SUMMARY
        echo "- **No GitHub Storage**: Completely bypasses GitHub quota limits" >> $GITHUB_STEP_SUMMARY
        echo "- **Immediate Access**: Click the link and download instantly" >> $GITHUB_STEP_SUMMARY
        echo "- **No Login Required**: Public download, no authentication needed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 2️⃣ ALTERNATIVE WORKFLOW" >> $GITHUB_STEP_SUMMARY
        echo "- Go to: **Actions** tab → **Alternative Release** → **Run workflow**" >> $GITHUB_STEP_SUMMARY
        echo "- This uploads with different naming to avoid quota conflicts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 3️⃣ MANUAL BUILD" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo '# Clone the repository' >> $GITHUB_STEP_SUMMARY
        echo 'git clone https://github.com/noxfighter777-sudo/adis_bingo.git' >> $GITHUB_STEP_SUMMARY
        echo 'cd adis_bingo' >> $GITHUB_STEP_SUMMARY
        echo 'git checkout main' >> $GITHUB_STEP_SUMMARY
        echo '' >> $GITHUB_STEP_SUMMARY
        echo '# Install dependencies and build' >> $GITHUB_STEP_SUMMARY
        echo 'npm ci' >> $GITHUB_STEP_SUMMARY
        echo 'npm run build' >> $GITHUB_STEP_SUMMARY
        echo 'npm run build:server' >> $GITHUB_STEP_SUMMARY
        echo 'npm run electron:dist' >> $GITHUB_STEP_SUMMARY
        echo '' >> $GITHUB_STEP_SUMMARY
        echo '# Find your .exe file' >> $GITHUB_STEP_SUMMARY
        echo 'ls -la release/*.exe' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 4️⃣ WAIT AND RETRY" >> $GITHUB_STEP_SUMMARY
        echo "- GitHub storage quota resets every 6-12 hours" >> $GITHUB_STEP_SUMMARY
        echo "- Try the main workflow again later when quota resets" >> $GITHUB_STEP_SUMMARY
        echo "- Check the **Actions** tab for successful uploads" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 5️⃣ DIRECT DOWNLOAD" >> $GITHUB_STEP_SUMMARY
        echo "- When GitHub artifacts upload successfully, they will appear in the **Actions** tab" >> $GITHUB_STEP_SUMMARY
        echo "- Look for: \`GrandBingo-Desktop-${{ github.run_number }}\` artifact" >> $GITHUB_STEP_SUMMARY
        echo "- Download size will be minimal (no compression, 0-day retention)" >> $GITHUB_STEP_SUMMARY

    - name: Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
