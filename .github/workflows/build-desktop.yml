name: Build Desktop Application

on:
  push:
    branches: [ new-exe ]
  pull_request:
    branches: [ new-exe ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Build frontend
      run: npm run build

    - name: Build server
      run: npm run build:server

    - name: Build Electron app
      run: npm run electron:dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      if: github.event_name == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: GrandBingo-Desktop-Windows-${{ github.run_number }}
        path: release/*.exe
        retention-days: 3
        compression-level: 9
        if-no-files-found: error

    - name: Create Release Summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Artifact Size**: $(ls -lh release/*.exe | awk '{print $5}' || echo 'No .exe file found')" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download Instructions" >> $GITHUB_STEP_SUMMARY
        echo "For builds without artifacts due to storage limits, please:" >> $GITHUB_STEP_SUMMARY
        echo "1. Wait 6-12 hours for storage quota to reset" >> $GITHUB_STEP_SUMMARY
        echo "2. Or manually build locally using: \`npm run electron:dist\`" >> $GITHUB_STEP_SUMMARY

    - name: Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
