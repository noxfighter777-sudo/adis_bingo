name: Build Desktop Application

on:
  push:
    branches: [ new-exe ]
  pull_request:
    branches: [ new-exe ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Build frontend
      run: npm run build

    - name: Verify frontend build
      run: |
        echo "Checking frontend build files..."
        ls -la dist/public/
        if [ ! -f "dist/public/index.html" ]; then
          echo "ERROR: Frontend build failed - index.html not found"
          exit 1
        fi
        echo "Frontend build verified successfully!"

    - name: Build server
      run: npm run build:server

    - name: Verify server build
      run: |
        echo "Checking server build files..."
        ls -la dist/
        if [ ! -f "dist/index.js" ]; then
          echo "ERROR: Server build failed - index.js not found"
          exit 1
        fi
        echo "Server build verified successfully!"

    - name: Verify all build files
      run: |
        echo "=== Build Verification Summary ==="
        echo "Server build: dist/index.js ($(ls -lh dist/index.js | awk '{print $5}')"
        echo "Frontend build: dist/public/index.html"
        echo "CSS assets: $(find dist/public/assets -name '*.css' | wc -l) files"
        echo "JS assets: $(find dist/public/assets -name '*.js' | wc -l) files"
        echo "Media files: $(find dist/public -name '*.png' -o -name '*.jpg' -o -name '*.mp3' | wc -l) files"
        echo "=================================="

    - name: Build Electron app
      run: npm run electron:dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: GrandBingo-Desktop-Windows-${{ github.run_number }}
        path: release/*.exe
        retention-days: 1
        compression-level: 9
        if-no-files-found: warn

    - name: Create Release Summary
      if: always()
      shell: bash
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Run Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # List all files in release directory
        echo "### Release Files" >> $GITHUB_STEP_SUMMARY
        if [ -d "release" ]; then
          for file in release/*; do
            if [ -f "$file" ]; then
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "- **$(basename "$file")**: $size" >> $GITHUB_STEP_SUMMARY
            fi
          done
        else
          echo "- No release files found" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### Download Options" >> $GITHUB_STEP_SUMMARY
        echo "1. **Artifacts**: Check the 'Actions' tab for downloadable artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. **Manual Build**: Run locally with \`npm run electron:dist\`" >> $GITHUB_STEP_SUMMARY
        echo "3. **Alternative**: Use the 'Alternative Release' workflow" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### Manual Build Instructions" >> $GITHUB_STEP_SUMMARY
        echo "If artifacts are not available due to storage limits:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo 'git clone https://github.com/Fira-Tech-Solutions/grand_bingo.git' >> $GITHUB_STEP_SUMMARY
        echo 'cd grand_bingo' >> $GITHUB_STEP_SUMMARY
        echo 'git checkout new-exe' >> $GITHUB_STEP_SUMMARY
        echo 'npm ci' >> $GITHUB_STEP_SUMMARY
        echo 'npm run build' >> $GITHUB_STEP_SUMMARY
        echo 'npm run build:server' >> $GITHUB_STEP_SUMMARY
        echo 'npm run electron:dist' >> $GITHUB_STEP_SUMMARY
        echo 'find release/ -name "*.exe" -ls' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
