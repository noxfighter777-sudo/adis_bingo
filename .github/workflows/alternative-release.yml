name: Alternative Release (Storage Quota Fallback)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Storage quota issue workaround'
  schedule:
    # Run daily at 2 AM UTC to check if storage quota allows upload
    - cron: '0 2 * * *'

jobs:
  try-release:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: new-exe

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Pre-build Cleanup
      shell: powershell
      run: |
        if (Test-Path release) { Remove-Item -Recurse -Force release }
        if (Test-Path dist) { Remove-Item -Recurse -Force dist }
        if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }

    - name: Install dependencies (fresh)
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Build frontend
      run: npm run build

    - name: Verify frontend build
      shell: bash
      run: |
        echo "Checking frontend build files..."
        ls -la dist/public/
        if [ ! -f "dist/public/index.html" ]; then
          echo "ERROR: Frontend build failed - index.html not found"
          exit 1
        fi
        echo "Frontend build verified successfully!"

    - name: Build server
      run: npm run build:server

    - name: Verify server build
      shell: bash
      run: |
        echo "Checking server build files..."
        ls -la dist/
        if [ ! -f "dist/index.js" ]; then
          echo "ERROR: Server build failed - index.js not found"
          exit 1
        fi
        echo "Server build verified successfully!"

    - name: Build Electron app
      run: npm run electron:dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_OPTIONS: "--max-old-space-size=4096"
        PYTHON: python3

    - name: Try Upload Artifacts
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: GrandBingo-Desktop-Windows-Alt
        path: release/*.exe
        retention-days: 1
        compression-level: 9
        if-no-files-found: warn

    - name: Upload to Transfer.sh (Emergency Bypass)
      continue-on-error: true
      shell: bash
      run: |
        echo "🚀 EMERGENCY BYPASS: Uploading to Transfer.sh (14-day storage)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Find the .exe file
        EXE_FILE=$(find release/ -name "*.exe" | head -1)
        
        if [ -f "$EXE_FILE" ]; then
          echo "Found executable: $EXE_FILE" >> $GITHUB_STEP_SUMMARY
          echo "File size: $(ls -lh "$EXE_FILE" | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Upload to transfer.sh
          echo "Uploading to Transfer.sh..." >> $GITHUB_STEP_SUMMARY
          TRANSFER_URL=$(curl --upload-file "$EXE_FILE" https://transfer.sh/$(basename "$EXE_FILE") 2>/dev/null)
          
          if [ ! -z "$TRANSFER_URL" ]; then
            echo "✅ Upload successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🎯 DIRECT DOWNLOAD LINK" >> $GITHUB_STEP_SUMMARY
            echo "**Download URL (valid for 14 days):**" >> $GITHUB_STEP_SUMMARY
            echo "$TRANSFER_URL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Click the link above to download immediately!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Transfer.sh upload failed" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "❌ No .exe file found in release directory" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Create Build Info
      if: always()
      shell: bash
      run: |
        echo "## Alternative Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Files Created**:" >> $GITHUB_STEP_SUMMARY
        ls -la release/ >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No release files found" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Manual Build Instructions" >> $GITHUB_STEP_SUMMARY
        echo "If artifact upload fails due to storage limits:" >> $GITHUB_STEP_SUMMARY
        echo "1. Clone this repository" >> $GITHUB_STEP_SUMMARY
        echo "2. Run: \`npm ci && npm run build && npm run build:server && npm run electron:dist\`" >> $GITHUB_STEP_SUMMARY
        echo "3. Find the .exe file in the \`release/\` directory" >> $GITHUB_STEP_SUMMARY
